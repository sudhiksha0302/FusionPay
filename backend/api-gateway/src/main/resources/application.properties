spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Product Service
spring.cloud.gateway.mvc.routes[0].id=product-service
spring.cloud.gateway.mvc.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/products/**

# User Service
spring.cloud.gateway.mvc.routes[1].id=user-service
spring.cloud.gateway.mvc.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/users/**

# Finance Service
spring.cloud.gateway.mvc.routes[2].id=finance-service
spring.cloud.gateway.mvc.routes[2].uri=lb://FINANCE-SERVICE
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/purchases/**

# Admin Service
spring.cloud.gateway.mvc.routes[3].id=admin-service
spring.cloud.gateway.mvc.routes[3].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/admin/**