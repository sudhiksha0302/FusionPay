<div class="users-page">

    <div class="page-header">

        <h1>👥 Manage Users</h1>

        <p>
            View and monitor all registered users.
        </p>

    </div>

    <div class="table-card">

        <table class="table">

            <thead>

                <tr>

                    <th>User ID</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Verified</th>
                    <th>Activated</th>

                </tr>

            </thead>

            <tbody>

                <tr *ngFor="let user of users">

                    <td>{{user.userId}}</td>
                    <td>{{user.name}}</td>
                    <td>{{user.username}}</td>
                    <td>{{user.email}}</td>

                    <td>

                        <span
                        [class.text-success]="user.verified"
                        [class.text-danger]="!user.verified">

                            {{user.verified ? 'Yes' : 'No'}}

                        </span>

                    </td>

                    <td>

                        <span
                        [class.text-success]="user.activated"
                        [class.text-danger]="!user.activated">

                            {{user.activated ? 'Yes' : 'No'}}

                        </span>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
